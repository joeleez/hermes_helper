# 一個 agent（PM）、一個 Feishu App、一個 named volume
#
# 啟動：  docker compose up -d
# 日誌：  docker compose logs -f pm
# 停止：  docker compose stop
#
# 設計：不覆蓋映像的 entrypoint。
# 官方映像用 s6-overlay，初始化流程是 /etc/cont-init.d/* → 主程式。
# 我們把 seed 腳本掛進 cont-init.d，由 root 在服務啟動前執行，
# 之後主程式以 hermes 使用者（uid 10000）身分跑，檔案權限自然正確。

services:
  pm:
    # 以官方映像為基底，加裝 Feishu 依賴（見 Dockerfile）
    build:
      context: .
    image: hermes-helper-pm:local
    container_name: hermes-pm
    restart: unless-stopped

    # 交給官方 main-wrapper 路由：等同 hermes gateway
    command: ["gateway"]

    env_file:
      - .env
    environment:
      AGENT_NAME: pm
      HERMES_HOME: /opt/data

    volumes:
      # 唯一持有狀態的地方
      - pm-data:/opt/data
      # 首次啟動 seed（root 執行，結束後 chown 給 hermes）
      - ./scripts/seed-agent.sh:/etc/cont-init.d/99-seed-agent:ro
      # 框架內容（唯讀）
      - ./agents/pm:/opt/bootstrap/agent:ro
      - ./skills:/opt/bootstrap/skills:ro

    stop_grace_period: 30s

    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/data/config.yaml || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  pm-data:
    name: hermes-pm-data
